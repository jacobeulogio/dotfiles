# Set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "tmux-256color"

# Change tmux prefix to Meta + a
set -g prefix M-a
unbind C-b
bind-key M-a send-prefix

# Tmux Detach
unbind y
bind-key y run-shell "bash ~/scripts/tmux_detach >> /dev/null" 

# Gemini
unbind g
bind-key g run-shell "bash ~/scripts/tmux_gemini >> /dev/null || true" 

# Opencode
unbind o
bind-key o run-shell "bash ~/scripts/tmux_opencode >> /dev/null || true" 

# Change Prefix + . to swap panes
unbind-key .
bind-key . command-prompt -p "Swap with target window:" \
"run-shell 'tmux swap-window -s $(tmux display-message -p \"#I\") -t %1 && tmux select-window -t %1'"

# Retain cwd
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Join-pane keymap
unbind-key J
bind-key J if-shell -F '#{?#{pane_marked_set},1,0}' \
    'join-pane -h -s "{marked}"' \
    'choose-window "join-pane -h -s \"%%\""'

unbind-key j
bind-key j command-prompt -p "Join pane from window:" \
    "join-pane -h -s %1"

# Toggle-able Terminal
bind-key t if-shell '[ "$(tmux list-panes | wc -l )" = 1 ]' {
 split-window -h -l 40% -c '#{pane_current_path}' 
} {
 if-shell '[ -n "$(tmux list-panes -F ''#F'' | grep Z)" ]' {
   select-pane -t:.-
 } {
   resize-pane -Z -t1
 }
}

# Resize panes like in Vim
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Use vi keys in copy mode
setw -g mode-keys vi
# bind-key -T prefix v copy-mode
unbind-key -T copy-mode-vi v
unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# General Settings
set -g status-keys vi
set -g set-clipboard on
set -g mouse on
set -g status-interval 3 
set -g detach-on-destroy off
set -g base-index 1
set -g pane-base-index 1

# Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

#======================================================================================

bg="#3A3A3A"
default_fg="#c5c9c5" 

# Status bar
set -g status-style bg=default
set -g status-fg colour245     # White text color
set-option -g status-position bottom
set -g status-left "#[fg=default, bg=default] #S "
# set -g status-left "#[fg=default, bold, bg=default] #S "
set -g status-right "#[fg=default, bg=default] #h@#(ip addr | grep enp | grep inet | awk '{print $2}')"
set -g window-status-format "#[fg=default,bg=default] #I:#W#F"
set -g window-status-current-format "#[fg=${default_fg},bold, bg=default] #I:#W"
# set -g window-status-last-style "fg=default,bg=default"

# Border Style
set -g pane-border-style "fg=#272727,bg=default"
set -g pane-active-border-style "fg=${bg},bg=default"

set -g message-command-style "bg=default,fg=${default_fg}"
set -g message-style "bg=default,fg=${default_fg}"

#======================================================================================

# Vim Tmux navigation
set -g @vim_navigator_prefix_mapping_clear_screen ""

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
