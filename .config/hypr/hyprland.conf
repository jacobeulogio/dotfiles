$terminal = wezterm
$browser = qutebrowser

source = ~/.config/hypr/keymaps.conf
# source = ~/.config/hypr/hardware.conf

### Autostart
exec-once = nm-applet & swaync & blueman-applet & hyprpaper & waybar & hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = systemctl --user start hyprpolkitagent

### Hardware
# Home Laptop Setup
monitor = desc:Xiaomi Corporation Mi Monitor 583341003628, 1920x1080@120, 0x0, 1
monitor = eDP-2, 1920x1200@165, 1920x0, 1

# Work Setup
monitor = desc:Samsung Electric Company S22F350 H4ZN301749, 1920x1080@60, 0x0, 1
monitor = HDMI-A-2, 1920x1080@100, 1920x0, 1

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape 
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
         natural_scroll = true 
    }
}

gestures { 
    workspace_swipe = true 
}

device { 
}

### Look and feel 
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 2

        # col.active_border = rgba(6a6a6aff) 45deg
        col.active_border = rgba(5a5a5ae6) 
        col.inactive_border = rgba(000000e6)

    resize_on_border = false
    allow_tearing = false
    layout = master
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, 

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, slide
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = specialWorkspace, 1, 4, default, slidefadevert -100%
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true 
    vfr = true
}

### Windows and Workspaces 
dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = slave
}

# "Smart gaps" / "No gaps when only"
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 2, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 2, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# Gemini scratchpad
workspace = special:gemini, on-created-empty:wezterm start tmux new-session -As gemini 'source ~/.zshrc && gemini', gapsout:10
workspace = special:todo, on-created-empty:wezterm start nvim ~/projects/todo/todo.md, gapsout:20
workspace = special:nixsearch, on-created-empty:qutebrowser --target window 'https://search.nixos.org/packages', gapsout:10

# windowrule = float, title:^gemini-scratchpad$
# windowrule = size 80% 80%, title:^gemini-scratchpad$
# windowrule = center, title:^gemini-scratchpad$

windowrule = suppressevent maximize, class:.*

# Make File Manager Floating
windowrulev2 = float, class:^(org.gnome.Nautilus)$
windowrulev2 = float, class:^(xdg-desktop-portal-gnome)$ 

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = noblur, class:^(rofi)$ 

# Wayland Video Bridge White Box
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$ 
windowrulev2 = noanim, class:^(xwaylandvideobridge)$ 
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$ 
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$ 
windowrulev2 = noblur, class:^(xwaylandvideobridge)$ 
windowrulev2 = nofocus, class:^(xwaylandvideobridge)$

# Environment variables 
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GOOGLE_CLOUD_PROJECT,dashboard-441809

